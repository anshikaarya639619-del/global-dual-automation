name: 365x24x7 Master Automation Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-mrbeast-empire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Execute 365x24x7 Master System
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          python main.py
          
