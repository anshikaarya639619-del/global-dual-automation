name: 24/7 YouTube Automation

on:
  schedule:
    - cron: '0 * * * *' # हर घंटे ये सिस्टम चेक करेगा और वीडियो/रील्स को आगे बढ़ाएगा
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Execute Automation
        run: python main.py
        
