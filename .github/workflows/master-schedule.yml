name: MrBeast Infinite God-Mode Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante me automatic chalega (Din me 4 baar)

jobs:
  run-infinite-empire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute MrBeast Auto Empire Pipeline
        run: |
          python main.py
          
