name: MrBeast Infinite God-Mode Engine

on:
  schedule:
    - cron: '0 */4 * * *' # Din me 6 baar chalega taaki quota pura ho!
  workflow_dispatch:

jobs:
  run-infinite-empire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Edge-TTS)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts requests google-api-python-client

      - name: Run Infinite Content & Live Dispatcher
        run: |
          python main.py
          python live_streamer.py
          
